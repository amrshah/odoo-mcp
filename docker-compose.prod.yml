services:
  db:
    image: postgres:16-alpine
    container_name: odoo_db
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-postgres}
      - POSTGRES_USER=${POSTGRES_USER:-odoo}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-odoo_db_password_123}
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - odoo-db-data:/var/lib/postgresql/data/pgdata
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-odoo} -d ${POSTGRES_DB:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - odoo-net

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    image: odoo-mcp-web:latest
    container_name: odoo_web
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${ODOO_HTTP_PORT:-8069}:8069"
      - "${ODOO_LONGPOLLING_PORT:-8072}:8072"
    volumes:
      - odoo-web-data:/var/lib/odoo
    environment:
      - HOST=db
      - USER=${POSTGRES_USER:-odoo}
      - PASSWORD=${POSTGRES_PASSWORD:-odoo_db_password_123}
      - POSTGRES_DB=${POSTGRES_DB:-postgres}
      - ODOO_DB=${ODOO_DB:-odoo_hospital}
    restart: unless-stopped
    networks:
      - odoo-net

  mcp:
    build:
      context: ./mcp-server
      dockerfile: Dockerfile
    image: odoo-mcp-server:latest
    container_name: odoo_mcp
    depends_on:
      - web
    ports:
      - "${MCP_SERVER_PORT:-8008}:8008"
    environment:
      - ODOO_URL=http://web:8069
      - ODOO_DB=${ODOO_DB:-odoo_hospital}
      - ODOO_USERNAME=${ODOO_USERNAME:-zelix_service}
      - ODOO_PASSWORD=${ODOO_PASSWORD:-zelix_service_secret_key_2026}
      - MCP_TRANSPORT=sse
      - MCP_SERVER_HOST=0.0.0.0
      - MCP_SERVER_PORT=8008
    restart: unless-stopped
    networks:
      - odoo-net

  zelix_copilot:
    build:
      context: ./zelix-copilot-backend
      dockerfile: Dockerfile
    image: odoo-mcp-copilot:latest
    container_name: zelix_copilot
    depends_on:
      - web
    ports:
      - "${ZELIX_COPILOT_PORT:-8010}:8010"
    environment:
      - ODOO_URL=http://web:8069
      - ODOO_DB=${ODOO_DB:-odoo_hospital}
      - ODOO_USERNAME=${ODOO_USERNAME:-zelix_service}
      - ODOO_PASSWORD=${ODOO_PASSWORD:-zelix_service_secret_key_2026}
      - ALAMIA_AI_URL=${ALAMIA_AI_URL:-https://ai.alamiaconnect.com}
      - BITNET_API_KEY=${BITNET_API_KEY:-51129693340}
      - BITNET_DEFAULT_MODEL=${BITNET_DEFAULT_MODEL:-/models/BitNet-b1.58-2B-4T/ggml-model-i2_s.gguf}
      - GEMMA_MODEL=${GEMMA_MODEL:-}
      - OLLAMA_HOST=${OLLAMA_HOST:-}
    restart: unless-stopped
    networks:
      - odoo-net

volumes:
  odoo-db-data:
  odoo-web-data:

networks:
  odoo-net:
    driver: bridge
