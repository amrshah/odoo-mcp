services:
  alamia-odoobridge:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/alamiasoft/alamia-odoo-bridge:latest
    container_name: alamia_odoobridge
    restart: unless-stopped
    ports:
      - "${MCP_SERVER_PORT:-8008}:8008"
    environment:
      - ODOO_URL=${ODOO_URL:-http://host.docker.internal:8069}
      - ODOO_DB=${ODOO_DB:-odoo_hospital}
      - ODOO_USERNAME=${ODOO_USERNAME:-zelix_service}
      - ODOO_PASSWORD=${ODOO_PASSWORD:?Error: ODOO_PASSWORD must be provided at runtime}
      - MCP_TRANSPORT=${MCP_TRANSPORT:-sse}
      - MCP_SERVER_HOST=0.0.0.0
      - MCP_SERVER_PORT=8008
      - BRIDGE_API_KEY=${BRIDGE_API_KEY:?Error: BRIDGE_API_KEY must be provided for remote gateway}
      - BRIDGE_SECRET_KEY=${BRIDGE_SECRET_KEY:-}
      - BRIDGE_ENFORCE_REMOTE_AUTH=true
      - BRIDGE_EXECUTION_POLICY=${BRIDGE_EXECUTION_POLICY:-controlled_writes}
      - BRIDGE_ALLOW_UNLINK=${BRIDGE_ALLOW_UNLINK:-false}
      - BRIDGE_ENABLE_SCHEMA_CACHE=true
      - BRIDGE_SCHEMA_CACHE_TTL_SECONDS=3600.0
    extra_hosts:
      - "host.docker.internal:host-gateway"
