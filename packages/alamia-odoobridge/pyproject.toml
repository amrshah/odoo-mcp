[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "alamia-odoobridge"
version = "0.1.0"
description = "The Independent Integration Gateway for Odoo & AI Agents"
readme = "README.md"
license = "LGPL-3.0-or-later"
requires-python = ">=3.11"
authors = [
    { name = "Alamia AI Team", email = "dev@alamiaconnect.com" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Lesser General Public License v3 or later (LGPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "fastmcp>=0.4.0",
    "mcp>=1.2.0",
    "pydantic>=2.7.0,<3.0.0",
    "pydantic-settings>=2.2.0,<3.0.0",
    "httpx>=0.27.0,<1.0.0",
    "uvicorn>=0.30.0",
    "starlette>=0.37.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.12.0",
]

[project.scripts]
alamia-odoobridge = "alamia_odoobridge.cli:main"
odoobridge = "alamia_odoobridge.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/alamia_odoobridge"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
