services:
  db:
    image: postgres:16-alpine
    container_name: odoo_db
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-postgres}
      - POSTGRES_USER=${POSTGRES_USER:-odoo}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-odoo_db_password_123}
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - odoo-db-data:/var/lib/postgresql/data/pgdata
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-odoo}"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    image: odoo-mcp-web:latest
    container_name: odoo_web
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${ODOO_HTTP_PORT:-8069}:8069"
      - "${ODOO_LONGPOLLING_PORT:-8072}:8072"
    volumes:
      - odoo-web-data:/var/lib/odoo
      - ./config:/etc/odoo
      - ./addons:/mnt/extra-addons
      - ./scripts:/scripts
      - ./docker-entrypoint.sh:/docker-entrypoint.sh
    environment:
      - HOST=db
      - USER=${POSTGRES_USER:-odoo}
      - PASSWORD=${POSTGRES_PASSWORD:-odoo_db_password_123}
      - POSTGRES_DB=${POSTGRES_DB:-postgres}
      - ODOO_DB=${ODOO_DB:-odoo_hospital}
    entrypoint: ["/docker-entrypoint.sh"]
    restart: unless-stopped

  mcp:
    build:
      context: ./mcp-server
      dockerfile: Dockerfile
    container_name: odoo_mcp
    depends_on:
      - web
    ports:
      - "${MCP_SERVER_PORT:-8008}:8008"
    volumes:
      - ./mcp-server:/app
    environment:
      - ODOO_URL=http://web:8069
      - ODOO_DB=${ODOO_DB:-odoo_hospital}
      - ODOO_USERNAME=${ODOO_USERNAME:-admin}
      - ODOO_PASSWORD=${ODOO_PASSWORD:-admin}
      - MCP_TRANSPORT=sse
      - MCP_SERVER_HOST=0.0.0.0
      - MCP_SERVER_PORT=8008
    restart: unless-stopped

  zelix_copilot:
    build:
      context: ./zelix-copilot-backend
      dockerfile: Dockerfile
    container_name: zelix_copilot
    depends_on:
      - web
    ports:
      - "${ZELIX_COPILOT_PORT:-8010}:8010"
    volumes:
      - ./zelix-copilot-backend:/app
    environment:
      - ODOO_URL=http://web:8069
      - ODOO_DB=${ODOO_DB:-odoo_hospital}
      - ODOO_USERNAME=${ODOO_USERNAME:-admin}
      - ODOO_PASSWORD=${ODOO_PASSWORD:-admin}
      - ALAMIA_AI_URL=${ALAMIA_AI_URL:-https://ai.alamiaconnect.com}
      - BITNET_API_KEY=${BITNET_API_KEY:-51129693340}
      - BITNET_DEFAULT_MODEL=${BITNET_DEFAULT_MODEL:-/models/BitNet-b1.58-2B-4T/ggml-model-i2_s.gguf}
    restart: unless-stopped

volumes:
  odoo-db-data:
  odoo-web-data:
